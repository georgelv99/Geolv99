<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音檔剪輯與合併工具 (免設定直接可用版)</title>
    
    <!-- 引入最新 v0.12 版的 FFmpeg -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .section { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <h1>🎵 網頁端音檔處理工具</h1>
    <p id="status" style="color: #d9534f; font-weight: bold;">系統狀態：等待載入 FFmpeg...</p>

    <!-- 剪輯區塊 -->
    <div class="section">
        <h2>✂️ 音檔剪輯</h2>
        <input type="file" id="cut-file" accept="audio/mpeg, audio/mp4, audio/x-m4a">
        <br><br>
        <label>開始時間 (秒): <input type="number" id="start-time" value="0"></label>
        <label>結束時間 (秒): <input type="number" id="end-time" value="10"></label>
        <br><br>
        <button id="btn-cut" disabled>開始剪輯</button>
    </div>

    <!-- 合併區塊 -->
    <div class="section">
        <h2>🔗 音檔合併</h2>
        <input type="file" id="merge-file1" accept="audio/mpeg, audio/mp4, audio/x-m4a">
        <input type="file" id="merge-file2" accept="audio/mpeg, audio/mp4, audio/x-m4a">
        <br><br>
        <button id="btn-merge" disabled>開始合併</button>
    </div>

    <!-- 結果區塊 -->
    <div class="section" id="result-section" style="display: none;">
        <h2>✅ 處理結果</h2>
        <audio id="result-audio" controls></audio>
        <br>
        <a id="download-link" href="#" download="output.mp3">⬇️ 下載檔案</a>
    </div>

    <script>
        // 🌟 修正點：v0.12 UMD 版的全局變數名稱是 FFmpegWASM
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile } = window.FFmpegUtil;
        
        // 建立 FFmpeg 實體
        const ffmpeg = new FFmpeg();
        const statusEl = document.getElementById('status');
        const btnCut = document.getElementById('btn-cut');
        const btnMerge = document.getElementById('btn-merge');

        // 初始化載入
        async function init() {
            try {
                statusEl.innerText = "系統狀態：正在下載處理引擎 (首次載入約需幾秒鐘)...";
                statusEl.style.color = "#f0ad4e";
                
                // 指定載入單執行緒版本的核心
                await ffmpeg.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
                    wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
                });
                
                statusEl.innerText = "系統狀態：✅ 引擎載入完成，可以開始使用！";
                statusEl.style.color = "#5cb85c";
                btnCut.disabled = false;
                btnMerge.disabled = false;
            } catch (e) {
                console.error(e);
                statusEl.innerText = "系統狀態：❌ 載入失敗：" + e.message;
            }
        }
        
        // 網頁開啟時立刻啟動
        init();

        // ✂️ 剪輯功能
        btnCut.addEventListener('click', async () => {
            const file = document.getElementById('cut-file').files[0];
            if (!file) return alert("請先選擇檔案！");
            
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            const ext = file.name.split('.').pop();
            const inputName = `input.${ext}`;
            const outputName = `output.mp3`;

            statusEl.innerText = "系統狀態：✂️ 剪輯處理中，請稍候...";
            
            await ffmpeg.writeFile(inputName, await fetchFile(file));
            await ffmpeg.exec(['-i', inputName, '-ss', start, '-to', end, '-c', 'copy', outputName]);
            await showResult(outputName);
        });

        // 🔗 合併功能
        btnMerge.addEventListener('click', async () => {
            const file1 = document.getElementById('merge-file1').files[0];
            const file2 = document.getElementById('merge-file2').files[0];
            if (!file1 || !file2) return alert("請選擇兩個檔案！");

            statusEl.innerText = "系統狀態：🔗 合併處理中，請稍候...";

            await ffmpeg.writeFile('1.mp3', await fetchFile(file1));
            await ffmpeg.writeFile('2.mp3', await fetchFile(file2));
            
            const listContent = "file '1.mp3'\nfile '2.mp3'";
            await ffmpeg.writeFile('list.txt', new TextEncoder().encode(listContent));

            await ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp3']);
            await showResult('output.mp3');
        });

        // 🎁 顯示與下載結果
        async function showResult(outputName) {
            const data = await ffmpeg.readFile(outputName);
            const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
            const url = URL.createObjectURL(blob);
            
            document.getElementById('result-section').style.display = 'block';
            const audio = document.getElementById('result-audio');
            const link = document.getElementById('download-link');
            
            audio.src = url;
            link.href = url;
            statusEl.innerText = "系統狀態：✅ 處理完成！你可以播放或下載了。";
        }
    </script>
</body>
</html>
